<!DOCTYPE html>
<html lang="ja" translate="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="google" content="notranslate">

  <title>仮面舞踏会 外伝</title>

  <style>

    :root {
      --bg: #000;
      --fg: #fff;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      background: var(--bg);
      color: var(--fg);
    }


    body {
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        "Noto Serif JP",
        serif;

      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }


    main {
      width: min(100%, 760px);
      margin: 0 auto;

      padding:
        120px
        24px
        140px;

      text-align: center;
    }


    /* ──────────────
       タイトル
       ────────────── */

    h1 {
      margin: 0;

      font-size: clamp(
        34px,
        8vw,
        48px
      );

      line-height: 1.5;

      font-weight: 400;

      letter-spacing: 0.04em;

      white-space: nowrap;
    }


    /* ──────────────
       外伝説明
       ────────────── */

    .introduction {
      margin-top: 70px;

      font-size: clamp(
        15px,
        4vw,
        19px
      );

      line-height: 2.15;

      font-weight: 400;

      letter-spacing: 0.025em;
    }


    .intro-line {
      margin: 0;
    }


    /* ──────────────
       外伝作品一覧
       ────────────── */

    .works {
      width: 100%;
      margin-top: 110px;
    }


    .work {
      width: 100%;

      margin: 0;
      padding: 0;
    }


    .work-link {
      display: block;

      width: 100%;

      color: #fff;

      text-decoration: none;
    }


    .work-link:visited {
      color: #fff;
    }


    .work-link:hover,
    .work-link:focus {
      text-decoration: none;
    }


    .work-title {
      display: block;

      font-size: clamp(
        18px,
        6vw,
        34px
      );

      line-height: 1.3;

      font-weight: 400;

      letter-spacing: 0.035em;

      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }


    .work-subtitle {
      display: block;

      margin-top: 2px;

      font-family:
        Georgia,
        "Times New Roman",
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;

      font-size: clamp(
        14px,
        4.6vw,
        28px
      );

      line-height: 1.25;

      font-weight: 400;

      letter-spacing: 0;

      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }


    .single-title {
      display: block;

      font-size: clamp(
        18px,
        6vw,
        34px
      );

      line-height: 1.3;

      font-weight: 400;

      letter-spacing: 0.035em;

      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }


    @media (max-width: 520px) {

      main {
        padding:
          100px
          12px
          120px;
      }


      h1 {
        font-size: 34px;
      }


      .introduction {
        margin-top: 64px;

        padding: 0 10px;

        font-size: 15px;

        line-height: 2.1;
      }


      .works {
        margin-top: 95px;
      }


      .work-title,
      .single-title {
        font-size: clamp(
          18px,
          6vw,
          28px
        );

        letter-spacing: 0.02em;
      }


      .work-subtitle {
        font-size: clamp(
          14px,
          4.6vw,
          22px
        );

        letter-spacing: 0;
      }

    }

  </style>
</head>


<body>

  <main>


    <h1>
      仮面舞踏会 外伝
    </h1>


    <section class="introduction">

      <p class="intro-line">
        我々は、幾度も醜悪に晒され生きている。
      </p>

      <p class="intro-line">
        そして仮面を付けた男も、</br>また幾度も醜悪へと向かうだろう。
      </p>

    </section>


    <!--
      外伝作品一覧はここから追加
    -->

    <div class="works">
      <p class="work">
        <a class="work-link" href="00.html">

          <span class="single-title">
            烙印
          </span>

        </a>
      </p>
    </div>


  </main>

</body>

</html>
